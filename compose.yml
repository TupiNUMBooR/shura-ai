# compose.yml
services:

  ms-max:
    build: ./ms-max
    image: shura-ms-max:local
    env_file:
      - .env
    volumes:
      - ./db/max:/db
    restart: unless-stopped

  ms-openai:
    build: ./ms-openai
    image: shura-ms-openai:local
    environment:
      CREDITS_PER_USD: 100000
    env_file:
      - .env
    volumes:
      - ./db:/db
    restart: unless-stopped
