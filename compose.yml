# compose.yml
services:

  ms-max:
    build: ./ms-max
    image: shura-ms-max:local
    env_file:
      - .env
    volumes:
      - ./db/max:/db
    restart: unless-stopped

  ms-openai:
    build: ./ms-openai
    image: shura-ms-openai:local
    environment:
      CREDITS_PER_USD: 100000
      SHOW_CREDITS: "true"
      SHOW_TRANSCRIPTION: "true"
    env_file:
      - .env
    volumes:
      - ./db:/db
    restart: unless-stopped

  ms-logs:
    build: ./ms-logs
    image: shura-ms-logs:local
    env_file:
      - .env
    environment:
      LOG_BATCH_SECONDS: 60
      CONTEXT_BEFORE_LINES: 10
      INCIDENT_DELAY_SECONDS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  ms-yookassa:
    build: ./ms-yookassa
    image: shura-ms-yookassa:local
    env_file:
      - .env
    volumes:
      - ./db:/db
    restart: unless-stopped
