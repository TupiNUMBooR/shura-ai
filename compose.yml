# compose.yml
services:

  ms-max:
    build:
      context: ./ms-max
      args:
        VERSION: "${VERSION:-dev}"
    image: shura-ms-max:${VERSION:-dev}
    user: "${USER_ID:-0}:${GROUP_ID:-0}"
    env_file:
      - .env
    volumes:
      - ./db/max:/db
    restart: unless-stopped

  ms-openai:
    build:
      context: ./ms-openai
      args:
        VERSION: "${VERSION:-dev}"
    image: shura-ms-openai:${VERSION:-dev}
    user: "${USER_ID:-0}:${GROUP_ID:-0}"
    environment:
      CREDITS_PER_USD: 100000
      SHOW_CREDITS: "true"
      SHOW_TRANSCRIPTION: "true"
    env_file:
      - .env
    volumes:
      - ./db:/db
    restart: unless-stopped

  ms-logs:
    build:
      context: ./ms-logs
      args:
        VERSION: "${VERSION:-dev}"
    image: shura-ms-logs:${VERSION:-dev}
    env_file:
      - .env
    environment:
      LOG_BATCH_SECONDS: 60
      CONTEXT_BEFORE_LINES: 10
      INCIDENT_DELAY_SECONDS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  ms-yookassa:
    build:
      context: ./ms-yookassa
      args:
        VERSION: "${VERSION:-dev}"
    image: shura-ms-yookassa:${VERSION:-dev}
    user: "${USER_ID:-0}:${GROUP_ID:-0}"
    env_file:
      - .env
    volumes:
      - ./db:/db
    restart: unless-stopped
